# 플레이 스토어에 올릴 AAB 파일을 업로드 키로 서명해서 만든다. (Actions 탭에서 직접 실행)
#
# 필요한 시크릿: 가족용 APK 빌드의 FIREBASE_* 6개, GOOGLE_WEB_CLIENT_ID,
# 업로드 키(base64) RELEASE_KEYSTORE_BASE64 와 그 비밀번호 RELEASE_KEY_PASSPHRASE
# 서명 키는 저장소에 올리지 않고 시크릿에만 보관한다.
name: 플레이 스토어용 앱 만들기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      RELEASE_KEY_PASSPHRASE: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      # 가족용 APK(1~999)와 겹치지 않고 항상 커지도록
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: 시크릿 확인
        run: |
          missing=""
          for v in EXPO_PUBLIC_FIREBASE_API_KEY EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID RELEASE_KEYSTORE_BASE64 RELEASE_KEY_PASSPHRASE; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::다음 시크릿이 없어요:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: 업로드 키 풀기
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/upload.keystore"
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$RELEASE_KEY_PASSPHRASE" -alias upload > /dev/null \
            || { echo "::error::업로드 키 또는 비밀번호가 맞지 않아요"; exit 1; }
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_KEY_PASSPHRASE" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=upload" >> "$GITHUB_ENV"

      - name: 버전 번호 설정
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const code = 1000 + Number(process.env.VERSION_CODE);
            app.expo.version = '1.1.' + process.env.VERSION_CODE;
            app.expo.android.versionCode = code;
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
            console.log('versionCode', code, 'version', app.expo.version);
          "

      - name: 네이티브 안드로이드 프로젝트 생성
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: AAB 빌드
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: 파일 이름 정리
        run: mv android/app/build/outputs/bundle/release/app-release.aab "family-anniversary-store-1.1.${VERSION_CODE}.aab"

      - uses: actions/upload-artifact@v5
        with:
          name: family-anniversary-aab
          path: family-anniversary-store-*.aab

      - name: Releases 에 올리기 (스토어용, 최신 표시 안 함)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "store-1.1.${VERSION_CODE}" family-anniversary-store-*.aab \
            --target "${{ github.sha }}" \
            --title "플레이 스토어용 1.1.${VERSION_CODE}" \
            --notes "플레이 콘솔에 업로드하는 파일이에요. 휴대폰에 직접 설치하는 파일이 아니에요." \
            --prerelease --latest=false
